name: managekar
label: Manage.kar
kind: platform
version: 1.0.0
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/Akshit1018/Manage.kar
description: >
  WhatsApp-style host QR / magic-link bridge for the Manage.kar companion.
  Mints a single-use managekar.pair.v1 ticket. The phone claims it, then
  speaks the official Hermes dashboard WebSocket (/api/ws, session.create).
  This is not Hermes DM pairing and not a plugin store.
author: Manage.kar
tags: [gateway, companion, pairing]
optional_env:
  - name: MANAGEKAR_ENABLED
    description: "Enable the Manage.kar platform adapter (true/false)"
    prompt: "Enable Manage.kar pairing?"
    password: false
  - name: MANAGEKAR_PUBLIC_BASE
    description: "Public or LAN URL of this Hermes dashboard (for QR links)"
    prompt: "Public Hermes URL (e.g. http://192.168.1.10:9119)"
    password: false
  - name: MANAGEKAR_DASHBOARD_TOKEN
    description: "Dashboard session token returned to the phone after claim"
    prompt: "Hermes dashboard session token"
    password: true
  - name: MANAGEKAR_PAIR_BASE
    description: "Public URL of the unauthenticated pair listener (default :9120)"
    prompt: "Pair listener URL (e.g. http://192.168.1.10:9120)"
    password: false
